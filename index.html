<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marketing Tool v2.0 - Deep Enrichment</title>
    
    <!-- PapaParse for parsing CSVs -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <!-- SheetJS for writing Excel (XLSX) files -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

    <style>
        :root {
            --win-bg: #d4d0c8;
            --win-border-light: #ffffff;
            --win-border-dark: #808080;
            --win-border-darker: #404040;
            --win-blue: #000080;
            --win-text: #000000;
        }

        body {
            background-color: #008080;
            font-family: "MS Sans Serif", "Segoe UI", Tahoma, sans-serif;
            font-size: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        .win95-window {
            background-color: var(--win-bg);
            border-top: 2px solid var(--win-border-light);
            border-left: 2px solid var(--win-border-light);
            border-right: 2px solid var(--win-border-darker);
            border-bottom: 2px solid var(--win-border-darker);
            width: 800px;
            max-height: 95vh;
            box-shadow: 1px 1px 0px 0px var(--win-border-dark) inset, -1px -1px 0px 0px var(--win-border-dark) inset;
            display: flex;
            flex-direction: column;
        }

        .title-bar {
            background: linear-gradient(90deg, #000080, #1084d0);
            color: white;
            padding: 3px 5px;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
        }

        .title-bar-controls {
            display: flex;
            gap: 2px;
        }

        .title-bar-btn {
            background-color: var(--win-bg);
            border-top: 1px solid var(--win-border-light);
            border-left: 1px solid var(--win-border-light);
            border-right: 1px solid var(--win-border-darker);
            border-bottom: 1px solid var(--win-border-darker);
            width: 16px;
            height: 14px;
            font-size: 10px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: default;
            color: black;
            box-shadow: 1px 1px 0px 0px var(--win-border-dark) inset, -1px -1px 0px 0px var(--win-border-dark) inset;
        }

        .menu-bar {
            display: flex;
            padding: 2px 5px;
            gap: 10px;
            border-bottom: 1px solid var(--win-border-dark);
            box-shadow: 0 1px 0 var(--win-border-light);
            margin-bottom: 5px;
        }

        .menu-item {
            cursor: pointer;
        }
        .menu-item span { text-decoration: underline; }

        .content {
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            overflow-y: auto;
        }

        .group-box {
            border-top: 2px solid var(--win-border-dark);
            border-left: 2px solid var(--win-border-dark);
            border-right: 2px solid var(--win-border-light);
            border-bottom: 2px solid var(--win-border-light);
            padding: 15px 10px 10px 10px;
            position: relative;
            margin-top: 5px;
        }

        .group-box-title {
            position: absolute;
            top: -8px;
            left: 8px;
            background-color: var(--win-bg);
            padding: 0 4px;
            color: var(--win-text);
        }

        .row {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .win95-sunken {
            border-top: 2px solid var(--win-border-dark);
            border-left: 2px solid var(--win-border-dark);
            border-right: 2px solid var(--win-border-light);
            border-bottom: 2px solid var(--win-border-light);
            background-color: white;
            padding: 4px;
            box-shadow: inset 1px 1px 0px 0px black, inset -1px -1px 0px 0px var(--win-bg);
        }

        .win95-input {
            width: 100%;
            border: none;
            outline: none;
            font-family: inherit;
            font-size: 12px;
            background: transparent;
        }
        
        .placeholder-text { color: #808080; }

        .win95-button {
            background-color: var(--win-bg);
            border-top: 2px solid var(--win-border-light);
            border-left: 2px solid var(--win-border-light);
            border-right: 2px solid var(--win-border-darker);
            border-bottom: 2px solid var(--win-border-darker);
            padding: 4px 15px;
            font-family: inherit;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: inset 1px 1px 0px 0px var(--win-bg), inset -1px -1px 0px 0px var(--win-border-dark);
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .win95-button:active {
            border-top: 2px solid var(--win-border-darker);
            border-left: 2px solid var(--win-border-darker);
            border-right: 2px solid var(--win-border-light);
            border-bottom: 2px solid var(--win-border-light);
            box-shadow: inset 1px 1px 0px 0px var(--win-border-dark);
            padding: 5px 14px 3px 16px;
        }

        .win95-button:disabled {
            color: #808080;
            text-shadow: 1px 1px 0px white;
            cursor: not-allowed;
        }

        textarea {
            width: 100%;
            height: 250px;
            resize: none;
            font-family: "Courier New", Courier, monospace;
            font-size: 12px;
            box-sizing: border-box;
            color: #000;
        }

        .progress-container {
            height: 18px;
            width: 100%;
            margin-top: 5px;
            box-sizing: border-box;
            position: relative;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background-color: var(--win-blue);
        }

        .status-bar-container {
            display: flex;
            gap: 2px;
            padding: 2px;
            margin-top: 5px;
        }

        .status-pane {
            padding: 2px 4px;
            color: var(--win-border-dark);
            flex-grow: 1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .status-pane.fixed {
            flex-grow: 0;
            width: 120px;
            text-align: center;
        }
        
        input[type="file"] { display: none; }
    </style>
</head>
<body>

    <div class="win95-window">
        <!-- Title Bar -->
        <div class="title-bar">
            <span>🌐 Marketing Tool GUI v2.0 - Enhanced Insights</span>
            <div class="title-bar-controls">
                <div class="title-bar-btn">_</div>
                <div class="title-bar-btn">□</div>
                <div class="title-bar-btn">×</div>
            </div>
        </div>

        <!-- Menu Bar -->
        <div class="menu-bar">
            <div class="menu-item"><span>F</span>ile</div>
            <div class="menu-item"><span>E</span>dit</div>
            <div class="menu-item"><span>V</span>iew</div>
            <div class="menu-item"><span>H</span>elp</div>
        </div>

        <div class="content">
            <!-- Configuration -->
            <div class="group-box">
                <span class="group-box-title">System Configuration</span>
                <div class="row">
                    <span style="min-width: 100px;">⚷ API Key:</span>
                    <div class="win95-sunken" style="flex-grow: 1;">
                        <input type="text" id="apiKeyInput" class="win95-input placeholder-text" value="People Data Labs Key (Optional - Uses Simulation if empty)">
                    </div>
                </div>
            </div>

            <!-- Persona Targeting (NEW FEATURE) -->
            <div class="group-box">
                <span class="group-box-title">Target Persona Matching</span>
                <div class="row">
                    <span style="min-width: 100px;">Key Identifiers:</span>
                    <div class="win95-sunken" style="flex-grow: 1;">
                        <input type="text" id="keywordsInput" class="win95-input" value="CEO, Founder, Director, Vice President, VP, C-Suite, Senior">
                    </div>
                </div>
                <p style="margin: 5px 0 0 0; color: #555; font-size: 11px;">* Comma-separated job titles or seniority keywords to track in the output analysis.</p>
            </div>

            <!-- Data Source -->
            <div class="group-box">
                <span class="group-box-title">Data Source (CSV)</span>
                <div class="row">
                    <button class="win95-button" onclick="document.getElementById('csvFileInput').click()">
                        ⇧ Browse CSV...
                    </button>
                    <input type="file" id="csvFileInput" accept=".csv">
                    <div class="win95-sunken" style="flex-grow: 1; background-color: var(--win-bg);">
                        <input type="text" id="fileDisplay" class="win95-input" value="No file selected. Please choose a file." readonly tabindex="-1">
                    </div>
                </div>
            </div>

            <!-- Run Button -->
            <div class="row" style="margin: 5px 0;">
                <button class="win95-button" id="runBtn" onclick="startAnalysis()">
                    ▶ Execute Deep Analysis
                </button>
            </div>

            <!-- Terminal Output -->
            <div class="group-box" style="flex-grow: 1; padding-bottom: 15px;">
                <span class="group-box-title">Terminal Output</span>
                <div class="win95-sunken" style="padding: 0;">
                    <textarea id="terminalLog" class="win95-input" readonly>System ready. Configure targeting parameters and select a CSV to begin.</textarea>
                </div>
                
                <div style="margin-top: 10px;">
                    <span id="progressText">Status: 0%</span>
                    <div class="win95-sunken progress-container" style="padding: 1px;">
                        <div class="progress-bar" id="progressBar"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Status Bar -->
        <div class="status-bar-container">
            <div class="win95-sunken status-pane" id="statusLeft" style="background-color: var(--win-bg);">Ready</div>
            <div class="win95-sunken status-pane fixed" id="statusRight" style="background-color: var(--win-bg);">0 bytes</div>
        </div>
    </div>

    <script>
        // State variables
        let selectedFile = null;
        let isFirstLog = true;
        let currentProgress = 0;

        // DOM Elements
        const apiKeyInput = document.getElementById('apiKeyInput');
        const keywordsInput = document.getElementById('keywordsInput');
        const fileInput = document.getElementById('csvFileInput');
        const fileDisplay = document.getElementById('fileDisplay');
        const terminalLog = document.getElementById('terminalLog');
        const progressBar = document.getElementById('progressBar');
        const progressText = document.getElementById('progressText');
        const statusLeft = document.getElementById('statusLeft');
        const statusRight = document.getElementById('statusRight');
        const runBtn = document.getElementById('runBtn');

        // Placeholder logic for API Input
        apiKeyInput.addEventListener('focus', function() {
            if (this.value === 'People Data Labs Key (Optional - Uses Simulation if empty)') {
                this.value = '';
                this.classList.remove('placeholder-text');
                this.type = 'password';
            }
        });

        apiKeyInput.addEventListener('blur', function() {
            if (this.value === '') {
                this.type = 'text';
                this.value = 'People Data Labs Key (Optional - Uses Simulation if empty)';
                this.classList.add('placeholder-text');
            }
        });

        fileInput.addEventListener('change', function(e) {
            if (e.target.files.length > 0) {
                selectedFile = e.target.files[0];
                fileDisplay.value = selectedFile.name;
                
                let sizeStr = selectedFile.size.toLocaleString() + " bytes";
                statusRight.innerText = sizeStr;
                
                clearLog();
                log(`[FILE IO] Loaded targets from: ${selectedFile.name}`);
                setProgress(5);
                setStatus("File loaded. Ready for analysis.");
            }
        });

        function log(message) {
            if (isFirstLog) {
                terminalLog.value = '';
                isFirstLog = false;
            }
            terminalLog.value += message + '\n';
            terminalLog.scrollTop = terminalLog.scrollHeight;
        }

        function clearLog() {
            terminalLog.value = '';
            isFirstLog = false;
        }

        function setProgress(percent) {
            currentProgress = percent;
            progressText.innerText = `Status: ${percent}%`;
            progressBar.style.width = `${percent}%`;
        }

        function setStatus(text) {
            statusLeft.innerText = text;
        }

        async function hashEmailSHA256(email) {
            if (!email || typeof email !== 'string') return null;
            const cleaned = email.trim().toLowerCase();
            
            // Primary: Use built-in Crypto API if in a secure context (HTTPS/localhost)
            if (window.crypto && window.crypto.subtle) {
                const msgBuffer = new TextEncoder().encode(cleaned);
                const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
                const hashArray = Array.from(new Uint8Array(hashBuffer));
                return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
            } else {
                // Fallback: If running as a local file (file://), use a lightweight pseudo-hash
                // This prevents the application from crashing while still providing anonymity
                let hash = 0;
                for (let i = 0; i < cleaned.length; i++) {
                    const char = cleaned.charCodeAt(i);
                    hash = ((hash << 5) - hash) + char;
                    hash = hash & hash; // Convert to 32bit integer
                }
                const hex = Math.abs(hash).toString(16).padStart(8, '0');
                return "local_hash_" + hex + hex; 
            }
        }

        async function lookupSocials(email, anonymMap, apiKey) {
            const clientId = anonymMap[email] || "Unknown_Client";
            const hashedEmail = await hashEmailSHA256(email);
            
            const domain = email.includes('@') ? email.split('@')[1].toLowerCase() : "unknown.com";
            const companyName = domain.split('.')[0];
            const genericProviders = ['gmail.com', 'yahoo.com', 'hotmail.com', 'outlook.com', 'aol.com', 'icloud.com'];
            const isGeneric = genericProviders.includes(domain);

            // Simulation Fallback: Generates rich, deterministic dummy data based on email characters
            if (!apiKey || apiKey === 'People Data Labs Key (Optional - Uses Simulation if empty)') {
                // Deterministic pseudo-random generation based on email string
                let charSum = email.split('').reduce((a, b) => a + b.charCodeAt(0), 0);
                
                const simTitles = ["CEO", "Marketing Director", "Software Engineer", "VP of Sales", "Founder", "Data Analyst", "Product Manager", "CTO", "Customer Success Lead"];
                const simSeniorities = ["C-Suite", "Director", "Mid-Level", "VP", "Owner", "Entry-Level", "Manager", "Executive", "Senior"];
                const simLocations = ["San Francisco, CA", "New York, NY", "Austin, TX", "London, UK", "Remote", "Chicago, IL", "Seattle, WA", "Toronto, ON"];
                const simSizes = ["1-10", "11-50", "51-200", "201-500", "501-1000", "1000+"];
                const simIndustries = ["Technology", "Healthcare", "Finance", "Consumer Goods", "SaaS", "E-commerce", "Media", "Real Estate"];

                let simTitle = simTitles[charSum % simTitles.length];
                let simSeniority = simSeniorities[(charSum * 2) % simSeniorities.length];
                let simLocation = simLocations[(charSum * 3) % simLocations.length];
                let simSize = simSizes[(charSum * 4) % simSizes.length];
                let simIndustry = simIndustries[(charSum * 5) % simIndustries.length];

                // If generic email, adjust slightly to represent general consumer
                if (isGeneric) {
                    simTitle = ["Student", "Freelancer", "Consultant", "Independent"][charSum % 4];
                    simSeniority = "Individual";
                    simIndustry = "Consumer / Independent";
                    simSize = "1";
                }

                return {
                    client_id: clientId,
                    email_hash: hashedEmail,
                    linkedin: isGeneric ? null : `https://www.linkedin.com/company/${companyName}`,
                    twitter: isGeneric ? null : `https://twitter.com/${companyName}`,
                    instagram: isGeneric ? `https://instagram.com/user_${clientId.toLowerCase()}` : `https://instagram.com/${companyName}_brand`,
                    job_title: simTitle,
                    seniority: simSeniority,
                    location: simLocation,
                    company_size: simSize,
                    industry: simIndustry,
                    skills: isGeneric ? "Creative, Management" : "Strategy, Leadership, Operations",
                    interests: isGeneric ? "Travel, Gadgets" : "B2B Tech, Investing, Startups",
                    status: "simulated_enrichment"
                };
            }

            // Real API Execution for PDL (People Data Labs)
            const url = `https://api.peopledatalabs.com/v5/person/enrich?email_hash=${hashedEmail}`;
            try {
                const response = await fetch(url, {
                    method: 'GET',
                    headers: { 'Accept-Encoding': 'gzip', 'X-Api-Key': apiKey }
                });

                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                
                const json = await response.json();
                const data = json.data || {};

                if (Object.keys(data).length === 0) {
                    return { client_id: clientId, email_hash: hashedEmail, status: "No profile found" };
                }

                const jobHistory = data.experience || [];
                const currentJob = jobHistory.length > 0 ? jobHistory[0] : {};
                const jobTitle = currentJob.title ? currentJob.title.name : null;
                const seniority = currentJob.title && currentJob.title.levels ? currentJob.title.levels.join(", ") : "Unknown";
                const companySize = currentJob.company && currentJob.company.size ? currentJob.company.size : "Unknown";
                const location = data.location_name || "Unknown";
                
                const skillsList = data.skills ? data.skills.slice(0, 5) : [];
                const interestsList = data.interests ? data.interests.slice(0, 5) : [];

                return {
                    client_id: clientId,
                    email_hash: hashedEmail,
                    linkedin: data.linkedin_url || null,
                    twitter: data.twitter_url || null,
                    instagram: data.facebook_url || null, // IG fallback map
                    job_title: jobTitle,
                    seniority: seniority,
                    location: location,
                    company_size: companySize,
                    industry: data.industry || null,
                    skills: skillsList.length > 0 ? skillsList.join(", ") : null,
                    interests: interestsList.length > 0 ? interestsList.join(", ") : "General Professional",
                    status: "success"
                };
            } catch (e) {
                return { client_id: clientId, email_hash: hashedEmail, status: `API Error: ${e.message}` };
            }
        }

        function parseCSVFile(file) {
            return new Promise((resolve, reject) => {
                Papa.parse(file, {
                    header: true,
                    skipEmptyLines: true,
                    complete: function(results) { resolve(results.data); },
                    error: function(err) { reject(err); }
                });
            });
        }

        async function startAnalysis() {
            if (!selectedFile) {
                clearLog();
                log(">> SYSTEM HALTED: No CSV file selected.");
                log(">> Please click 'Browse CSV...' to select a target list.");
                setStatus("Error: Missing CSV");
                return;
            }

            runBtn.disabled = true;
            clearLog();
            log("[SYSTEM] Initializing core data pipeline...");
            setProgress(10);
            setStatus("Extracting identifiers...");

            // Get API Key and Target Keywords (Fixed validation logic)
            let apiKey = apiKeyInput.value.trim();
            if (apiKey === "People Data Labs Key (Optional - Uses Simulation if empty)" || !apiKey) {
                apiKey = null;
                log("[MODE] Running Local Deep Simulation Mode (No API key detected).");
            } else {
                log("[MODE] Live API Request Mode Activated.");
            }

            const rawKeywords = keywordsInput.value;
            const targetKeywords = rawKeywords.split(',')
                                              .map(k => k.trim().toLowerCase())
                                              .filter(k => k.length > 0);
            log(`[CONFIG] Monitoring for Key Identifiers: ${targetKeywords.join(', ') || 'None'}`);

            try {
                log("[IO] Parsing CSV data structure...");
                const parsedData = await parseCSVFile(selectedFile);
                setProgress(15);

                if (parsedData.length === 0) throw new Error("CSV file is structurally empty.");

                // Find Email Column
                const columns = Object.keys(parsedData[0]);
                const colsLower = columns.map(c => c.toLowerCase());
                
                let targetCol = null;
                if (colsLower.includes('email')) {
                    targetCol = columns[colsLower.indexOf('email')];
                } else {
                    let matchingCols = columns.filter(c => c.toLowerCase().includes('email') && !c.toLowerCase().includes('manager'));
                    if (matchingCols.length === 0) matchingCols = columns.filter(c => c.toLowerCase().includes('email'));
                    targetCol = matchingCols.length > 0 ? matchingCols[0] : null;
                }

                if (!targetCol) {
                    throw new Error("Could not detect an 'email' column. Aborting.");
                }

                const rawEmails = parsedData.map(row => row[targetCol]).filter(e => e && e.trim() !== '');
                const emails = [...new Set(rawEmails)]; // Unique emails
                
                log(`[PROCESSING] Extracted ${emails.length} unique targets.`);
                log(`[SECURITY] Applying SHA-256 cryptographic hashing for anonymity...`);
                setProgress(20);

                const anonymMap = {};
                emails.forEach((email, idx) => { anonymMap[email] = `PersonID_${idx + 1}`; });

                // Lookup phase
                log("[NETWORK] Cross-referencing entities against social databanks...");
                const socialProfiles = [];
                for (let i = 0; i < emails.length; i++) {
                    const profile = await lookupSocials(emails[i], anonymMap, apiKey);
                    socialProfiles.push(profile);
                    
                    if (i % Math.ceil(emails.length / 10) === 0) { // Log occasionally
                        log(`  -> Retrieved payload for ${profile.client_id} [Hash: ${profile.email_hash.substring(0,8)}...]`);
                    }
                    setProgress(Math.floor(20 + ((i + 1) / emails.length) * 50));
                }

                log("[ANALYTICS] Structuring enrichment data and mapping personas...");
                setProgress(75);

                // Bucketing Variables
                const linkedinBucket = [];
                const twitterBucket = [];
                const instagramBucket = [];
                
                // Analytics Aggregators
                let totalTargetMatches = 0;
                const counts = { industry: {}, location: {}, seniority: {}, size: {} };

                socialProfiles.forEach(p => {
                    // Check against Key Identifiers safely
                    let isTargetMatch = "No";
                    let matchedKeyword = "";
                    
                    if (targetKeywords.length > 0) {
                        // Safe null checks before calling .toLowerCase()
                        const titleLower = p.job_title ? p.job_title.toLowerCase() : "";
                        const senLower = p.seniority ? p.seniority.toLowerCase() : "";
                        
                        for (let kw of targetKeywords) {
                            if ((titleLower && titleLower.includes(kw)) || (senLower && senLower.includes(kw))) {
                                isTargetMatch = "Yes";
                                matchedKeyword = kw;
                                totalTargetMatches++;
                                break;
                            }
                        }
                    }

                    // Tally demographics for ICP
                    if (p.industry && p.industry !== "Unknown") counts.industry[p.industry] = (counts.industry[p.industry] || 0) + 1;
                    if (p.location && p.location !== "Unknown") counts.location[p.location] = (counts.location[p.location] || 0) + 1;
                    if (p.seniority && p.seniority !== "Unknown") counts.seniority[p.seniority] = (counts.seniority[p.seniority] || 0) + 1;
                    if (p.company_size && p.company_size !== "Unknown") counts.size[p.company_size] = (counts.size[p.company_size] || 0) + 1;

                    // Base Enriched Profile
                    const enrichedRecord = {
                        Anonymized_ID: p.client_id,
                        Target_Persona_Match: isTargetMatch,
                        Matched_On: matchedKeyword,
                        Job_Title: p.job_title || "Unlisted",
                        Seniority: p.seniority || "Unlisted",
                        Industry: p.industry || "Unlisted",
                        Company_Size: p.company_size || "Unlisted",
                        Location: p.location || "Unlisted",
                        Skills: p.skills || "N/A"
                    };

                    if (p.linkedin) {
                        linkedinBucket.push({ ...enrichedRecord, Platform_URL: p.linkedin });
                    }
                    if (p.twitter) {
                        twitterBucket.push({ ...enrichedRecord, Interests: p.interests, Platform_URL: p.twitter });
                    }
                    if (p.instagram) {
                        instagramBucket.push({ ...enrichedRecord, Interests: p.interests, Platform_URL: p.instagram });
                    }
                });

                log("[COMPUTATION] Generating Ideal Customer Profile vectors...");
                setProgress(85);

                // Helper to get top item from tally
                const getTop = (dict) => {
                    const sorted = Object.keys(dict).sort((a, b) => dict[b] - dict[a]);
                    return sorted.length > 0 ? `${sorted[0]} (${dict[sorted[0]]})` : "N/A";
                };

                const topInd = getTop(counts.industry);
                const topLoc = getTop(counts.location);
                const topSen = getTop(counts.seniority);
                const topSize = getTop(counts.size);

                log("\n=======================================================");
                log(">> IDEAL CUSTOMER PROFILE (ICP) - DEEP ANALYSIS REPORT");
                log("=======================================================");
                log(`Total Entities Analyzed : ${emails.length}`);
                log(`Target Persona Matches  : ${totalTargetMatches} (Based on custom keywords)`);
                log(`Match Rate              : ${((totalTargetMatches / emails.length) * 100).toFixed(1)}%`);
                log("-------------------------------------------------------");
                log(`Primary Industry Focus  : ${topInd}`);
                log(`Geographic Concentration: ${topLoc}`);
                log(`Dominant Seniority Lvl  : ${topSen}`);
                log(`Avg Company Size        : ${topSize}`);
                log("=======================================================\n");

                setProgress(95);
                const exportFilename = 'Rich_Social_Enrichment_Report.xlsx';
                log(`[I/O] Assembling rich Excel export: ${exportFilename}...`);

                const wb = XLSX.utils.book_new();
                
                const addSheet = (data, sheetName) => {
                    const ws = data.length > 0 ? XLSX.utils.json_to_sheet(data) : XLSX.utils.json_to_sheet([{ status: "No records found for this platform." }]);
                    XLSX.utils.book_append_sheet(wb, ws, sheetName);
                };

                // Create Executive Summary Tab
                const execSummary = [
                    { Metric: "Total Records Analyzed", Value: emails.length },
                    { Metric: "Target Persona Matches", Value: totalTargetMatches },
                    { Metric: "Target Keywords Used", Value: targetKeywords.join(", ") || "None" },
                    { Metric: "", Value: "" },
                    { Metric: "Top Industry", Value: topInd },
                    { Metric: "Top Location", Value: topLoc },
                    { Metric: "Top Seniority", Value: topSen },
                    { Metric: "Top Company Size", Value: topSize },
                    { Metric: "", Value: "" },
                    { Metric: "Total LinkedIn Found", Value: linkedinBucket.length },
                    { Metric: "Total Twitter Found", Value: twitterBucket.length },
                    { Metric: "Total Instagram Found", Value: instagramBucket.length }
                ];

                addSheet(execSummary, "Executive_Summary");
                addSheet(linkedinBucket, "Enriched_LinkedIn");
                addSheet(twitterBucket, "Enriched_Twitter");
                addSheet(instagramBucket, "Enriched_Instagram");

                // Trigger download
                XLSX.writeFile(wb, exportFilename);

                setProgress(100);
                setStatus("Operation Complete.");
                log("[SUCCESS] Process Terminated Normally. Report exported to local downloads.");

            } catch (err) {
                log(`[FATAL EXCEPTION] >> ${err.message}`);
                setStatus("Error: Execution Halted");
                console.error(err);
            } finally {
                runBtn.disabled = false;
            }
        }
    </script>
</body>
</html>
